server {
    listen 80;
    server_name claudecode-dev.gbase.ai;

    # Logging
    access_log /var/log/nginx/claudecode-dev.access.log;
    error_log /var/log/nginx/claudecode-dev.error.log;

    # Frontend (Static files from dist directory)
    location / {
        root /home/claude/claudecodeui/dist;
        try_files $uri $uri/ /index.html;
        
        # Additional headers for better caching
        add_header Cache-Control "public, max-age=3600";
    }

    # API routes
    location /api/ {
        proxy_pass http://localhost:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important: Trust Cloudflare's headers
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://localhost:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}